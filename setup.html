<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعداد الحساب الأول | لوحة تحكم العمران</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-body">

  <form id="setupForm" class="auth-card" novalidate>
    <div class="auth-brand">
      <strong>العمران</strong>
      <span>لوحة التحكم</span>
    </div>

    <h1>إعداد الحساب الأول</h1>
    <p class="auth-sub">لا يوجد أي حساب بعد. أنشئ حساب المسؤول الأول للدخول إلى لوحة التحكم.</p>

    <div class="form-field">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="form-field">
      <label for="bootstrapToken">رمز التهيئة</label>
      <input type="text" id="bootstrapToken" name="bootstrapToken" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required>
      <p class="form-note">من متغير BOOTSTRAP_TOKEN في إعدادات الاستضافة، أو من أحدث سطر <span dir="ltr">[Setup] BOOTSTRAP_TOKEN</span> في سجل التشغيل (يمكنك لصق السطر كاملاً).</p>
    </div>

    <div class="form-field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
      <p class="form-note">12 حرفاً على الأقل.</p>
    </div>
    <div class="form-field">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
    </div>

    <div id="setupError" class="auth-error hidden"></div>

    <button type="submit" class="btn btn-dark btn-block">إنشاء الحساب والدخول</button>
  </form>

<script src="js/dashboard.js" data-page="setup"></script>
</body>
</html>
