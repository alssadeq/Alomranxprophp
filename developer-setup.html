<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعداد حساب المطوّر | العمران</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-body">

  <form id="devSetupForm" class="auth-card" novalidate>
    <div class="auth-brand">
      <strong>العمران</strong>
      <span>مركز تحكم المطوّر</span>
    </div>

    <h1>إعداد حساب المطوّر الأول</h1>
    <p class="auth-sub">هذا الحساب منفصل تماماً عن حسابات لوحة تحكم الأعمال، ومخصص للمطوّر/المسؤول التقني عن النظام.</p>

    <div class="form-field">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="bootstrapToken">رمز التهيئة</label>
      <input type="text" id="bootstrapToken" name="bootstrapToken" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required>
      <p class="form-note">افتح مدير الملفات في Hostinger، ثم المجلد <span dir="ltr">public_html/data</span>، ثم الملف <span dir="ltr">bootstrap-token.txt</span>، وانسخ ما بداخله.</p>
    </div>

    <div class="form-field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
      <p class="form-note">12 حرفاً على الأقل.</p>
    </div>
    <div class="form-field">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
    </div>

    <div id="devSetupError" class="auth-error hidden"></div>

    <button type="submit" class="btn btn-dark btn-block">إنشاء حساب المطوّر والدخول</button>
  </form>

<script src="js/dev-center.js" data-page="developer-setup"></script>
</body>
</html>
