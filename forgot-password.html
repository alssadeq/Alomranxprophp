<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور | لوحة تحكم العمران</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-body">

  <form id="forgotForm" class="auth-card" novalidate>
    <div class="auth-brand">
      <strong>العمران</strong>
      <span>لوحة التحكم</span>
    </div>

    <h1>نسيت كلمة المرور</h1>
    <p class="auth-sub">أدخل البريد الإلكتروني المرتبط بحسابك وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.</p>

    <div class="form-field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div id="forgotMessage" class="auth-error hidden"></div>

    <button type="submit" class="btn btn-dark btn-block">إرسال رابط الاستعادة</button>
    <a href="/login" class="auth-link">العودة لتسجيل الدخول</a>
  </form>

<script src="js/dashboard.js" data-page="forgot-password"></script>
</body>
</html>
