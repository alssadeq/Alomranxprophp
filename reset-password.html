<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>تعيين كلمة مرور جديدة | لوحة تحكم العمران</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-body">

  <form id="resetForm" class="auth-card" novalidate>
    <div class="auth-brand">
      <strong>العمران</strong>
      <span>لوحة التحكم</span>
    </div>

    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="auth-sub">اختر كلمة مرور جديدة لحسابك (12 حرفاً على الأقل).</p>

    <div class="form-field">
      <label for="password">كلمة المرور الجديدة</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="12">
    </div>
    <div class="form-field">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="12">
    </div>

    <div id="resetMessage" class="auth-error hidden"></div>

    <button type="submit" class="btn btn-dark btn-block">حفظ كلمة المرور</button>
    <a href="/forgot-password" class="auth-link">طلب رابط جديد</a>
  </form>

<script src="js/dashboard.js" data-page="reset-password"></script>
</body>
</html>
